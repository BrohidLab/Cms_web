<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hosting Expired</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #1e88e5;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      background-color: white;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .container img {
      max-width: 200px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 28px;
      color: #1e88e5;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      margin-bottom: 25px;
      color: #666;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #1e88e5;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #1669c1;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 22px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://cdn-icons-png.flaticon.com/512/595/595067.png" alt="Expired Icon" />
    <h1>Hosting Telah Expired</h1>
    <p>Maaf, layanan hosting untuk domain ini telah berakhir. Silakan hubungi penyedia layanan untuk memperpanjang masa aktif.</p>
    <a href="https://domainesia.com" class="btn">Perpanjang Sekarang</a>
  </div>
</body>
</html>
